<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台指期 · 振幅監測</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0e1518; --panel:#141d21; --panel2:#1a2529; --line:#25333a;
    --ink:#e9edf0; --muted:#8b9aa2; --faint:#5c6b73;
    --accent:#e0a14a; --cool:#4bb8c9; --hot:#e8663a; --bar:#2b3a41;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{ background:radial-gradient(1200px 500px at 78% -8%, #16242a 0%, transparent 60%), var(--bg);
    color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; padding:22px 18px 56px; }
  .wrap{max-width:1120px; margin:0 auto}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}

  .top{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;
       border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:14px}
  .brand h1{font-size:19px; font-weight:650; margin:0}
  .brand .sub{color:var(--muted); font-size:12.5px; margin-top:3px}
  .brand .inst{color:var(--faint); font-size:12px; margin-top:2px; font-family:var(--mono)}
  .status{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted);
          margin-left:8px; padding:2px 8px; border:1px solid var(--line); border-radius:999px}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--faint)} .status.live .dot{background:var(--accent)}

  .ctrls{display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; margin-bottom:14px}
  .ctrlgrp{display:flex; align-items:center; gap:7px}
  .ctrlgrp>.lbl{font-size:12px; color:var(--faint)}
  .datebox{display:inline-flex; align-items:center; gap:6px}
  .stepbtn{appearance:none; background:var(--panel); border:1px solid var(--line); color:var(--ink);
    width:30px; height:32px; border-radius:8px; cursor:pointer; font-size:13px}
  .stepbtn:hover{border-color:var(--accent)} .stepbtn:disabled{opacity:.35; cursor:default}
  .datesel{appearance:none; background:var(--panel); border:1px solid var(--line); color:var(--ink);
    font-family:var(--mono); font-size:14px; padding:7px 12px; border-radius:8px; cursor:pointer; min-width:130px}
  .datesel:focus-visible,.stepbtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .toggle{display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--panel)}
  .toggle button{appearance:none; background:transparent; border:0; color:var(--muted); font-family:var(--sans);
    font-size:13px; padding:7px 14px; cursor:pointer; white-space:nowrap}
  .toggle button.on{background:var(--accent); color:#1a1206; font-weight:600}
  .toggle button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .toggle button.icon{padding:6px 11px}
  .toggle button.icon svg{width:18px; height:18px; display:block; vertical-align:middle}

  /* 模式卡（同時是三時段比較） */
  .modes{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap}
  .mode{flex:1 1 0; min-width:104px; display:flex; flex-direction:column; align-items:flex-start; gap:1px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 14px; cursor:pointer; text-align:left}
  .mode:hover{border-color:#3a4d57}
  .mode.active{border-color:var(--accent); background:linear-gradient(180deg,#1c2733,#141d21); box-shadow:inset 0 0 0 1px var(--accent)}
  .mode .ml{font-size:12.5px; color:var(--muted)} .mode.active .ml{color:var(--accent)}
  .mode .mrow{display:flex; align-items:baseline; gap:5px}
  .mode .mv{font-family:var(--mono); font-size:22px; font-weight:600; color:var(--ink)}
  .mode .mu{font-size:11px; color:var(--faint)}
  .mode:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .grid{display:grid; grid-template-columns:1fr; gap:16px}
  body[data-layout="side"] .grid{grid-template-columns:1fr 1fr}
  body[data-layout="side"] .chartbox{height:240px}
  body[data-layout="single"] #panel-b{display:none}
  @media(max-width:880px){ body[data-layout="side"] .grid{grid-template-columns:1fr} }
  .panel{background:linear-gradient(180deg,var(--panel) 0%,#121a1e 100%); border:1px solid var(--line); border-radius:14px; padding:18px 18px 8px}
  .phead{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:2px}
  .phead .sess{font-size:13px; color:var(--muted); font-weight:600}
  .phead .pctl{font-family:var(--mono); font-size:11.5px; color:var(--faint)}
  .readout{display:flex; align-items:baseline; gap:10px; margin:6px 0 4px}
  .readout .big{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:46px; font-weight:600; line-height:1}
  .readout .unit{font-size:15px; color:var(--muted)}
  .readout .alt{margin-left:auto; text-align:right; color:var(--muted); font-size:12.5px}
  .readout .alt b{color:var(--ink); font-family:var(--mono); font-weight:600}
  .ohlc{display:flex; gap:18px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin:2px 0 8px}
  .ohlc span b{font-family:var(--mono); color:var(--ink); font-weight:600; margin-left:5px}
  .date{color:var(--faint); font-size:12px; font-family:var(--mono); margin-bottom:12px}

  .gauge{margin:4px 0 14px}
  .track{position:relative; height:12px; border-radius:7px; background:#0d1417; border:1px solid var(--line)}
  .fill{position:absolute; left:0; top:0; bottom:0; border-radius:7px 0 0 7px; opacity:.28; transition:width .35s, background .3s}
  .pip{position:absolute; top:50%; width:2px; height:20px; transform:translate(-50%,-50%); border-radius:2px; transition:left .35s, background .3s; box-shadow:0 0 8px currentColor}
  .scale{display:flex; justify-content:space-between; margin-top:7px; color:var(--faint); font-size:11px} .scale .num{color:var(--muted)}
  .read2{display:flex; gap:14px; flex-wrap:wrap; margin-top:9px; font-size:12px; color:var(--muted)}
  .read2 .k{color:var(--faint)} .read2 .v{font-family:var(--mono); color:var(--ink)} .read2 .v.hi{color:var(--accent)}

  .strip{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:2px 0 12px}
  .cell{background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:8px 10px}
  .cell .k{font-size:11px; color:var(--faint)} .cell .v{font-family:var(--mono); font-size:18px; font-weight:600; margin-top:1px}
  .ext{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:8px}
  .wcell{background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:8px 10px}
  .wt{font-size:11px; color:var(--faint); margin-bottom:4px}
  .wr{display:flex; align-items:baseline; justify-content:space-between; gap:6px; margin-top:2px}
  .wk{font-size:11px; color:var(--faint)}
  .wv{font-family:var(--mono); font-size:16px; font-weight:600}
  .wv.max{color:var(--hot)} .wv.min{color:var(--cool)}

  .sp{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:2px 0 10px}
  .sphead{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px}
  .spt{font-size:11.5px; color:var(--faint)}
  .spn{display:inline-flex; gap:3px}
  .nbtn{appearance:none; background:transparent; border:1px solid var(--line); color:var(--muted);
    font-family:var(--sans); font-size:11px; padding:2px 7px; border-radius:6px; cursor:pointer}
  .nbtn.on{background:var(--accent); color:#1a1206; border-color:var(--accent); font-weight:600}
  .nbtn:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  .sprow{display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:3px 0}
  .spk{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px}
  .pin{width:7px; height:7px; border-radius:2px; display:inline-block}
  .pin.hot{background:var(--hot)} .pin.cool{background:var(--cool)} .pin.mid{background:var(--accent)}
  .spv{display:flex; align-items:baseline; gap:7px}
  .spv b{font-family:var(--mono); font-size:16px; font-weight:600; color:var(--ink)}
  .spv b.acc{color:var(--accent)}
  .spv em{font-style:normal; font-family:var(--mono); font-size:11px; color:var(--faint)}
  .spbar{display:flex; height:5px; border-radius:3px; overflow:hidden; background:#0d1417; margin-top:7px}
  .spfill{height:100%; background:var(--hot); transition:width .35s}
  .spbar{position:relative} .spbar::after{content:''; position:absolute; inset:0; background:var(--cool); z-index:-1}
  .spbar{background:var(--cool)}
  .chartbox{height:300px; margin:6px -4px 4px; position:relative}
  @media(max-width:880px){.chartbox{height:240px}}
  .chartbox .nochart{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--faint); font-size:12px; text-align:center; padding:12px}

  .tablewrap{margin-top:22px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 4px 4px; overflow-x:auto}
  .tablewrap h2{font-size:13px; color:var(--muted); margin:0 0 4px 14px; font-weight:600}
  .tablewrap .hint{font-size:11.5px; color:var(--faint); margin:0 0 10px 14px}
  table{width:100%; border-collapse:collapse; font-size:13px; min-width:560px}
  th,td{padding:7px 12px; text-align:right; white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  thead th{color:var(--faint); font-weight:500; font-size:11.5px; border-bottom:1px solid var(--line)}
  tbody td{font-family:var(--mono); font-variant-numeric:tabular-nums; border-bottom:1px solid #1a2529; color:var(--ink)}
  tbody td:first-child{color:var(--muted)}
  tbody tr{cursor:pointer} tbody tr:hover td{background:#18242a}
  tbody tr.sel td{background:#20303733; box-shadow:inset 3px 0 0 var(--accent)} tbody tr.sel td:first-child{color:var(--accent)}

  .foot{color:var(--faint); font-size:11.5px; margin-top:18px; line-height:1.6} .foot code{font-family:var(--mono); color:var(--muted)}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
</style>
</head>
<body data-layout="single">
<div class="wrap">

  <div class="top">
    <div class="brand">
      <h1>台指期 · 振幅監測 <span class="status" id="status"><span class="dot"></span><span id="statusText">載入中</span></span></h1>
      <div class="sub">日盤／夜盤／全時段任選 · 選日期看當天開高低收與振幅 · MA5/10/20 · 近 20 日極值</div>
      <div class="inst" id="inst"></div>
    </div>
  </div>

  <div class="ctrls">
    <div class="ctrlgrp"><span class="lbl">日期</span>
      <div class="datebox">
        <button id="prevD" class="stepbtn" title="前一交易日">◀</button>
        <select id="dateSel" class="datesel"></select>
        <button id="nextD" class="stepbtn" title="後一交易日">▶</button>
      </div>
    </div>
    <div class="ctrlgrp"><span class="lbl">單位</span>
      <div class="toggle" role="group" aria-label="振幅單位">
        <button id="btnPt" class="on" onclick="setUnit('pt')">點數</button>
        <button id="btnPct" onclick="setUnit('pct')">百分比 %</button>
      </div>
    </div>
    <div class="ctrlgrp"><span class="lbl">版面</span>
      <div class="toggle" role="group" aria-label="圖表版面">
        <button id="btnSingle" class="icon on" onclick="setLayout('single')" title="單獨顯示" aria-label="單獨顯示"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V4h4"/><path d="M16 8V4h-4"/><path d="M4 12v4h4"/><path d="M16 12v4h-4"/></svg></button>
        <button id="btnSide" class="icon" onclick="setLayout('side')" title="並排比較（日盤＋夜盤）" aria-label="並排比較"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4.5" width="5.5" height="11" rx="1.2"/><rect x="11.5" y="4.5" width="5.5" height="11" rx="1.2"/></svg></button>
      </div>
    </div>
  </div>

  <!-- 三時段：點卡片即切換，數字是「選定那天」的振幅（隨單位變）-->
  <div class="modes" id="modes">
    <button class="mode" data-m="day"><span class="ml">日盤 08:45–13:45</span>
      <span class="mrow"><span class="mv num" id="mv-day">—</span><span class="mu" id="mu-day"></span></span></button>
    <button class="mode" data-m="night"><span class="ml">夜盤 15:00–05:00</span>
      <span class="mrow"><span class="mv num" id="mv-night">—</span><span class="mu" id="mu-night"></span></span></button>
  </div>

  <div class="grid" id="grid">
    <section class="panel" id="panel-a"></section>
    <section class="panel" id="panel-b"></section>
  </div>

  <div class="tablewrap">
    <h2 id="tabTitle">近 20 個交易日</h2>
    <p class="hint">開高低收與振幅為「上方選定的時段」；點任一列可切換到那天。</p>
    <table>
      <thead><tr>
        <th>日期</th><th>開</th><th>高</th><th>低</th><th>收</th><th>振幅 點</th><th>振幅 %</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script>
const U = { pt:{ampKey:'amp_pt',dp:0,unitLabel:'點',axis:'振幅（點）'}, pct:{ampKey:'amp_pct',dp:2,unitLabel:'%',axis:'振幅（%）'} };
const MODES=['day','night'];
let unit='pt', DATA=null, selIdx=0, mode='day', layout='single', spreadN=10;

function fmt(v,u){ return (v===null||v===undefined||Number.isNaN(v))?'—':Number(v).toFixed(U[u].dp); }
function heat(t){ t=Math.max(0,Math.min(1,t||0)); const c=[[75,184,201],[217,180,90],[232,102,58]]; let a,b,f;
  if(t<0.5){a=c[0];b=c[1];f=t/0.5}else{a=c[1];b=c[2];f=(t-0.5)/0.5}
  const m=i=>Math.round(a[i]+(b[i]-a[i])*f); return `rgb(${m(0)},${m(1)},${m(2)})`; }

const markerPlugin={ id:'selMarker', afterDatasetsDraw(ch){
  const idx=window.__selIdx, xs=ch.scales.x, area=ch.chartArea;
  if(idx==null||!xs||!area) return; const x=xs.getPixelForValue(idx);
  if(x<area.left-1||x>area.right+1) return; const ctx=ch.ctx; ctx.save();
  ctx.strokeStyle='rgba(224,161,74,.85)'; ctx.lineWidth=1.5; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(x,area.top); ctx.lineTo(x,area.bottom); ctx.stroke(); ctx.restore(); }};

async function load(){
  try{ const r=await fetch('amplitude_data.json',{cache:'no-store'}); if(!r.ok) throw 0; DATA=await r.json(); setStatus('online'); }
  catch(e){ DATA=JSON.parse(document.getElementById('fallback').textContent); setStatus('file'); }
  boot();
}
function setStatus(m){ const s=document.getElementById('status'), t=document.getElementById('statusText');
  s.classList.add('live'); t.textContent = m==='online' ? '線上更新' : '檔案內資料'; }

function boot(){
  document.getElementById('inst').textContent = DATA.instrument || '';
  const g=(DATA.generated_at||'').replace('T',' ').replace(/(\+08:00|Z)$/,'');
  const n=DATA.sessions.day.series.length;
  document.getElementById('foot').innerHTML =
    `${DATA.defs||''}<br>資料產生時間：<code>${g} (UTC+8)</code>　·　日期可選範圍：最近 ${n} 個交易日`
    + `（想拉更長，改 fetch_amplitude.py 的 CHART_DAYS 再重跑）。`;
  selIdx=n-1; window.__selIdx=selIdx;

  const sel=document.getElementById('dateSel'), s=DATA.sessions.day.series;
  let opts=''; for(let i=n-1;i>=0;i--) opts+=`<option value="${i}">${s[i].date}</option>`;
  sel.innerHTML=opts; sel.value=selIdx;
  sel.onchange=e=>setSel(+e.target.value);
  document.getElementById('prevD').onclick=()=>setSel(selIdx-1);
  document.getElementById('nextD').onclick=()=>setSel(selIdx+1);
  document.querySelectorAll('.mode').forEach(btn=> btn.onclick=()=>setMode(btn.dataset.m));

  render();
}
function setSel(i){ const n=DATA.sessions.day.series.length; selIdx=Math.max(0,Math.min(n-1,i)); window.__selIdx=selIdx;
  document.getElementById('dateSel').value=selIdx;
  document.getElementById('prevD').disabled=selIdx<=0; document.getElementById('nextD').disabled=selIdx>=n-1;
  render(); }
function setUnit(u){ if(u===unit)return; unit=u; document.getElementById('btnPt').classList.toggle('on',u==='pt');
  document.getElementById('btnPct').classList.toggle('on',u!=='pt'); render(); }
function setMode(m){ mode=m; layout='single'; document.body.dataset.layout='single';
  document.getElementById('btnSingle').classList.add('on'); document.getElementById('btnSide').classList.remove('on'); render(); }
function setLayout(l){ if(l===layout)return; layout=l; document.body.dataset.layout=l;
  document.getElementById('btnSingle').classList.toggle('on',l==='single');
  document.getElementById('btnSide').classList.toggle('on',l!=='single'); render(); }

function computeView(key,i){
  const s=DATA.sessions[key].series, row=s[i];
  const lb=s.slice(Math.max(0,i-249), i+1);
  const ext=(rows,k,how)=>{ let best=null; rows.forEach(r=>{ const v=r[k]; if(v==null)return;
    if(best==null||(how==='max'?v>best.v:v<best.v)) best={v,date:r.date}; }); return best; };
  const pct=(rows,k,val)=>{ const a=rows.map(r=>r[k]).filter(v=>v!=null); if(!a.length||val==null)return null;
    return a.filter(v=>v<=val).length/a.length*100; };
  const wins={}, spread={};
  [5,10,20].forEach(w=>{ const rows=s.slice(Math.max(0,i-w+1), i+1);
    wins[w]={ pt:{max:ext(rows,'amp_pt','max'),min:ext(rows,'amp_pt','min')},
              pct:{max:ext(rows,'amp_pct','max'),min:ext(rows,'amp_pct','min')} };
    const st=k=>{ const a=rows.map(r=>r[k]).filter(v=>v!=null); if(!a.length) return null;
      const avg=a.reduce((x,y)=>x+y,0)/a.length;
      const hi=a.filter(v=>v>avg), lo=a.filter(v=>v<=avg);
      const mean=arr=>arr.length? arr.reduce((x,y)=>x+y,0)/arr.length : null;
      return {n:a.length, avg, aboveDays:hi.length, aboveAvg:mean(hi), belowDays:lo.length, belowAvg:mean(lo)}; };
    spread[w]={ pt:st('amp_pt'), pct:st('amp_pct') }; });
  return { date:row.date, ohlc:{open:row.open,high:row.high,low:row.low,close:row.close},
    amp:{pt:row.amp_pt,pct:row.amp_pct},
    ma:{ pt:{ma5:row.ma5_pt,ma10:row.ma10_pt,ma20:row.ma20_pt}, pct:{ma5:row.ma5_pct,ma10:row.ma10_pct,ma20:row.ma20_pct} },
    wins, spread,
    pctile:{ pt:pct(lb,'amp_pt',row.amp_pt), pct:pct(lb,'amp_pct',row.amp_pct), n:lb.length } };
}

const panelHTML = `
  <div class="phead"><span class="sess" id="psess"></span><span class="pctl" id="pctlN"></span></div>
  <div class="readout"><span class="big" id="big"></span><span class="unit" id="bigUnit"></span>
    <span class="alt">另一單位<br><b id="alt"></b></span></div>
  <div class="ohlc" id="ohlc"></div>
  <div class="date" id="pdate"></div>

    <div class="scale"><span>近20日低 <span class="num" id="gmin"></span></span><span>近20日高 <span class="num" id="gmax"></span></span></div>
    <div class="read2"><span><span class="k">百分位</span> <span class="v hi" id="pctile"></span></span>
      <span><span class="k">當日 ÷ MA20</span> <span class="v" id="ratio"></span></span></div>
  </div>
  <div class="strip">
    <div class="cell"><div class="k">MA5</div><div class="v num" id="ma5"></div></div>
    <div class="cell"><div class="k">MA10</div><div class="v num" id="ma10"></div></div>
    <div class="cell"><div class="k">MA20</div><div class="v num" id="ma20"></div></div>
  </div>
  <div class="ext">
    <div class="wcell"><div class="wt">近5日</div>
      <div class="wr"><span class="wk">高</span><span class="wv max" id="e5max"></span></div>
      <div class="wr"><span class="wk">低</span><span class="wv min" id="e5min"></span></div></div>
    <div class="wcell"><div class="wt">近10日</div>
      <div class="wr"><span class="wk">高</span><span class="wv max" id="e10max"></span></div>
      <div class="wr"><span class="wk">低</span><span class="wv min" id="e10min"></span></div></div>
    <div class="wcell"><div class="wt">近20日</div>
      <div class="wr"><span class="wk">高</span><span class="wv max" id="e20max"></span></div>
      <div class="wr"><span class="wk">低</span><span class="wv min" id="e20min"></span></div></div>
  </div>
  <div class="sp">
    <div class="sphead"><span class="spt">振幅分布統計</span>
      <span class="spn"><button class="nbtn" data-n="5">5日</button><button class="nbtn on" data-n="10">10日</button><button class="nbtn" data-n="20">20日</button></span></div>
    <div class="sprow"><span class="spk"><i class="pin hot"></i>大於平均的振幅</span><span class="spv"><b id="spAboveAvg"></b><em id="spAboveDays"></em></span></div>
    <div class="sprow"><span class="spk"><i class="pin mid"></i><span id="spAvgLbl">平均振幅</span></span><span class="spv"><b id="spAvg" class="acc"></b></span></div>
    <div class="sprow"><span class="spk"><i class="pin cool"></i>小於平均的振幅</span><span class="spv"><b id="spBelowAvg"></b><em id="spBelowDays"></em></span></div>
    <div class="spbar"><div class="spfill" id="spFill"></div></div>
  </div>
  <div class="chartbox"><canvas id="cv"></canvas><div class="nochart" id="nochart" style="display:none">圖表函式庫未載入（離線）— 數字仍為完整資料</div></div>`;

function renderModes(){
  MODES.forEach(k=>{
    const v=computeView(k,selIdx);
    document.getElementById('mv-'+k).textContent=fmt(v.amp[unit],unit);
    document.getElementById('mu-'+k).textContent=U[unit].unitLabel;
    document.querySelector('.mode[data-m="'+k+'"]').classList.toggle('active', layout==='side' ? true : (k===mode));
  });
}
function renderPanelInto(el, key){
  if(!el.dataset.built){ el.innerHTML=panelHTML; el.dataset.built='1'; }
  const $=id=>el.querySelector('#'+id);
  const s=DATA.sessions[key], v=computeView(key,selIdx), u=unit, o=u==='pt'?'pct':'pt', amp=v.amp[u];
  $('psess').textContent=s.label;
  $('big').textContent=fmt(amp,u); $('bigUnit').textContent=U[u].unitLabel;
  $('alt').textContent=fmt(v.amp[o],o)+' '+U[o].unitLabel;
  const oh=v.ohlc;
  $('ohlc').innerHTML=`<span>開<b>${fmt(oh.open,'pt')}</b></span><span>高<b>${fmt(oh.high,'pt')}</b></span>`
    +`<span>低<b>${fmt(oh.low,'pt')}</b></span><span>收<b>${fmt(oh.close,'pt')}</b></span>`;
  $('pdate').textContent='交易日 '+v.date;
  const w20=v.wins[20][u]; const wmax=w20.max?w20.max.v:null, wmin=w20.min?w20.min.v:null;
  const span=(wmax!=null&&wmin!=null)?((wmax-wmin)||1):1;
  const pos=(wmax!=null&&wmin!=null&&amp!=null)?Math.max(0,Math.min(1,(amp-wmin)/span)):0;
  const pk=v.pctile[u], col=heat(pk!=null?pk/100:pos);
  $('gmin').textContent=fmt(wmin,u); $('gmax').textContent=fmt(wmax,u);
  $('fill').style.width=(pos*100).toFixed(1)+'%'; $('fill').style.background=col;
  $('pip').style.left=(pos*100).toFixed(1)+'%'; $('pip').style.background=col; $('pip').style.color=col;
  $('pctile').textContent = pk!=null? ('第 '+pk.toFixed(0)+' 百分位') : '—';
  $('pctlN').textContent='在近 '+v.pctile.n+' 日中';
  const ma20=v.ma[u].ma20;
  $('ratio').textContent=(ma20&&amp!=null)?('×'+(amp/ma20).toFixed(2)):'—';
  $('ma5').textContent=fmt(v.ma[u].ma5,u); $('ma10').textContent=fmt(v.ma[u].ma10,u); $('ma20').textContent=fmt(ma20,u);
  [5,10,20].forEach(w=>{ const mx=v.wins[w][u].max, mn=v.wins[w][u].min;
    $('e'+w+'max').textContent=mx?fmt(mx.v,u):'—';
    $('e'+w+'min').textContent=mn?fmt(mn.v,u):'—'; });

  // 振幅分布統計（大於/小於平均的天數）
  const sp=v.spread[spreadN][u];
  el.querySelectorAll('.nbtn').forEach(b=>{ b.classList.toggle('on', +b.dataset.n===spreadN);
    b.onclick=()=>{ spreadN=+b.dataset.n; render(); }; });
  $('spAvgLbl').textContent=spreadN+'日平均振幅';
  if(sp){
    $('spAvg').textContent=fmt(sp.avg,u);
    $('spAboveAvg').textContent=sp.aboveAvg!=null?fmt(sp.aboveAvg,u):'—';
    $('spBelowAvg').textContent=sp.belowAvg!=null?fmt(sp.belowAvg,u):'—';
    $('spAboveDays').textContent='('+sp.aboveDays+'天)';
    $('spBelowDays').textContent='('+sp.belowDays+'天)';
    $('spFill').style.width=(sp.n? sp.aboveDays/sp.n*100 : 0).toFixed(1)+'%';
  }
  drawChartInto(el, key);
}
function drawChartInto(el, key){
  const canvas=el.querySelector('#cv'), nochart=el.querySelector('#nochart');
  if(el._chart){ el._chart.destroy(); el._chart=null; }
  if(typeof Chart==='undefined'){ nochart.style.display='flex'; return; }
  nochart.style.display='none';
  const s=DATA.sessions[key].series, u=unit;
  const labels=s.map(r=>r.date.slice(5)), col=c=>s.map(r=>r[c]);
  el._chart=new Chart(canvas.getContext('2d'),{
    data:{labels, datasets:[
      {type:'bar',label:'振幅',data:col(U[u].ampKey),backgroundColor:'#2b3a41',borderWidth:0,order:5,barPercentage:1,categoryPercentage:0.94},
      {type:'line',label:'MA5',data:col('ma5_'+u),borderColor:'#e0a14a',borderWidth:1.4,pointRadius:0,tension:.25,order:1},
      {type:'line',label:'MA10',data:col('ma10_'+u),borderColor:'#4bb8c9',borderWidth:1.4,pointRadius:0,tension:.25,order:2},
      {type:'line',label:'MA20',data:col('ma20_'+u),borderColor:'#9aa8b0',borderWidth:1.4,pointRadius:0,tension:.25,borderDash:[4,3],order:3},
    ]},
    options:{ responsive:true, maintainAspectRatio:false, animation:{duration:300}, interaction:{mode:'index',intersect:false}, layout:{padding:{top:2}},
      plugins:{ legend:{labels:{color:'#8b9aa2',boxWidth:10,boxHeight:2,font:{size:11},padding:10},position:'top',align:'end'},
        tooltip:{backgroundColor:'#0d1417',borderColor:'#25333a',borderWidth:1,titleColor:'#e9edf0',bodyColor:'#c7d0d5',padding:8,
          callbacks:{label:c=>` ${c.dataset.label}: ${c.parsed.y==null?'—':c.parsed.y.toFixed(U[u].dp)}`}} },
      scales:{ x:{grid:{color:'#1a2529'},ticks:{color:'#5c6b73',font:{size:10},autoSkip:true,maxTicksLimit:8,maxRotation:0}},
        y:{grid:{color:'#1a2529'},ticks:{color:'#5c6b73',font:{size:10}},title:{display:true,text:U[u].axis,color:'#5c6b73',font:{size:10}}} } },
    plugins:[markerPlugin]
  });
}
function renderTable(){
  const s=DATA.sessions[mode].series, start=Math.max(0,s.length-20);
  document.getElementById('tabTitle').textContent='近 20 個交易日 · '+DATA.sessions[mode].label;
  let html='';
  for(let i=s.length-1;i>=start;i--){ const r=s[i];
    html+=`<tr data-i="${i}" class="${i===selIdx?'sel':''}"><td>${r.date}</td>`
      +`<td>${fmt(r.open,'pt')}</td><td>${fmt(r.high,'pt')}</td><td>${fmt(r.low,'pt')}</td><td>${fmt(r.close,'pt')}</td>`
      +`<td>${fmt(r.amp_pt,'pt')}</td><td>${fmt(r.amp_pct,'pct')}</td></tr>`; }
  const tb=document.getElementById('tbody'); tb.innerHTML=html;
  tb.querySelectorAll('tr').forEach(tr=> tr.onclick=()=>setSel(+tr.dataset.i));
}
function render(){ renderModes();
  const A=document.getElementById('panel-a'), B=document.getElementById('panel-b');
  if(layout==='side'){ renderPanelInto(A,'day'); renderPanelInto(B,'night'); }
  else { renderPanelInto(A, mode); }
  renderTable(); }
load();
</script>
